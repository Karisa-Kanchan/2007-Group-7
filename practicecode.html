Here’s a simple HTML page with a function that adds two numbers:

```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Add Two Numbers</title>
</head>
<body>
  <input type="number" id="firstNumber" placeholder="First number">
  <input type="number" id="secondNumber" placeholder="Second number">
  <button onclick="showSum()">Add</button>
  <p id="result"></p>

  <script>
    function addTwoNumbers(a, b) {
      return a + b;
    }

    function showSum() {
      const a = Number(document.getElementById("firstNumber").value);
      const b = Number(document.getElementById("secondNumber").value);
      document.getElementById("result").textContent = addTwoNumbers(a, b);
    }
  </script>
</body>
</html>
```
